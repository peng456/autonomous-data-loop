name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 内容校验 + 冒烟测试
        run: npm test
      - name: 生成图谱数据 + 静态 SEO 产物
        run: npm run build
      - name: 校验 SEO 产物（正文量 / sitemap / 结构化数据 / 深链接）
        run: npm run verify:seo
      - name: 组装站点（只发布运行所需文件）
        run: |
          mkdir -p _site
          cp -r index.html assets data topics _site/
          cp robots.txt sitemap.xml llms.txt _site/
          cp ./*.txt _site/          # 含 IndexNow 校验文件
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: IndexNow 主动推送（Bing / Yandex 秒级发现）
        run: node tools/indexnow.mjs
        continue-on-error: true
